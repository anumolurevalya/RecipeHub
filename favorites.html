<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RecipeHub - Favorites</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="home.html" class="logo">
        Recipe<span>Hub</span>
    </a>

    <div class="nav-links">

        <a href="home.html">Home</a>

        <a href="recipes.html">Recipes</a>

        <a href="favorites.html">Favorites ❤️</a>

        <a href="profile.html">Profile 👤</a>

    </div>

</nav>


<section class="favorite-section">

    <div class="favorite-header">

        <h1>❤️ My Favorite Recipes</h1>

        <p>
            Recipes you saved for later
        </p>

    </div>


    <div class="recipe-grid" id="favoriteGrid">

        <div class="recipe-card">

            <img src="images/biryani.jpg">

            <div class="recipe-info">

                <h3>Chicken Biryani</h3>

                <p>Indian • Non-Vegetarian</p>

                <div class="recipe-meta">

                    <span>⏱ 60 min</span>

                    <span class="rating">
                        ⭐ 4.8
                    </span>

                </div>

                <a href="recipe-details.html?recipe=biryani"
                   class="recipe-btn">
                    View Recipe
                </a>

            </div>

        </div>


        <div class="recipe-card">

            <img src="images/cake.jpg">

            <div class="recipe-info">

                <h3>Chocolate Cake</h3>

                <p>Dessert • Sweet</p>

                <div class="recipe-meta">

                    <span>⏱ 50 min</span>

                    <span class="rating">
                        ⭐ 4.9
                    </span>

                </div>

                <a href="recipe-details.html?recipe=cake"
                   class="recipe-btn">
                    View Recipe
                </a>

            </div>

        </div>

    </div>

</section>


<script src="js/script.js"></script>

</body>
</html>
