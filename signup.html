<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RecipeHub - Sign Up</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>

        <p>Join RecipeHub today!</p>


        <form id="signupForm">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>


        <div class="auth-link">

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
