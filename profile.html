<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RecipeHub - Profile</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="home.html" class="logo">
        Recipe<span>Hub</span>
    </a>

    <div class="nav-links">

        <a href="home.html">Home</a>

        <a href="recipes.html">Recipes</a>

        <a href="favorites.html">Favorites ❤️</a>

        <a href="profile.html">Profile 👤</a>

    </div>

</nav>


<div class="profile-container">

    <div class="profile-card">

        <img
            src="images/cake.jpg"
            class="profile-picture"
            alt="Profile"
        >

        <h1 id="profileName">
            Recipe Lover
        </h1>

        <p id="profileEmail">
            user@example.com
        </p>

        <br>

        <p>
            🍴 Food Lover
        </p>

        <p>
            ❤️ Favorite Recipes: 6
        </p>

        <p>
            ⭐ Recipes Rated: 12
        </p>

        <br>

        <button
            class="btn btn-primary"
            onclick="logout()">

            Logout

        </button>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>
